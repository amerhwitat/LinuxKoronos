name: Linux builder
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test hosted runtime and process adapter
        run: bash tests/smoke.sh ./build/koronos-host
      - name: Package Linux runtime
        run: BUILD_DIR=build bash tools/package-linux.sh
      - name: Upload LinuxKoronos runtime package
        uses: actions/upload-artifact@v4
        with:
          name: linuxkoronos-linux-hosted-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload raw host executable
        uses: actions/upload-artifact@v4
        with:
          name: linuxkoronos-host-executable-${{ runner.arch }}
          path: build/koronos-host
          if-no-files-found: error
          retention-days: 30

  build-linux-kernel:
    name: Linux 7.2.2 kernel / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cross: ""
            packages: "build-essential bc bison flex libssl-dev libelf-dev dwarves cpio rsync curl gnupg"
          - arch: arm64
            cross: "aarch64-linux-gnu-"
            packages: "build-essential bc bison flex libssl-dev libelf-dev dwarves cpio rsync curl gnupg gcc-aarch64-linux-gnu"
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build and package Linux kernel 7.2.2
        env:
          ARCH: ${{ matrix.arch }}
          CROSS_COMPILE: ${{ matrix.cross }}
          JOBS: "2"
          KERNEL_VERSION: "7.2.2"
        run: bash kernel/build-linux-kernel.sh
      - name: Upload kernel package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: linux-7.2.2-${{ matrix.arch }}
          path: |
            kernel-out/linux-7.2.2-${{ matrix.arch }}.tar.gz
            kernel-out/linux-7.2.2-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
